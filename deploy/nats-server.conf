# NATS configuration for lightningfeed.
#
# The bridge needs JetStream: its duplicate window is what absorbs the upstream's
# five-minute reconnect replay, and it is the only deduplication layer that
# survives a process restart.
#
# Start with:
#   nats-server -c deploy/nats-server.conf

port: 4222
http_port: 8222

jetstream {
  # The stream holds at most two hours, so this bounds the directory rather than
  # being the real limit.
  max_file_store: 2GiB
  max_mem_store:  256MiB
}

# Only this host needs to run the bridge.
authorization {
  users = [
    # The bridge publishes and consumes, and holds a KV lease.
    {
      user:     lightningfeed
      password: "CHANGE_ME"
      permissions: {
        publish: {
          allow: ["lightning.>", "_INBOX.>"]
        }
        subscribe: {
          allow: ["lightning.>", "_INBOX.>"]
        }
      }
    }
  ]
}

# The bridge is a private deployment. Bind to loopback unless it is deliberately
# shared, in which case put TLS in front and give each consumer its own account.