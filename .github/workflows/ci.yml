name: ci

# Also deliberately does not build the image.
#
# `make docker-pushx` builds and pushes it, and deliberately does so here rather
# than on every commit to main: a multi-architecture buildx push takes minutes and
# burns a runner's disk to produce a tag nobody asked for, and publishing needs
# Docker Hub credentials that do not belong in this repository. The image is a
# packaging of the binaries this job does check, so `make ci` remains everything
# that runs here.
#
# Deliberately does not touch the upstream.
#
# The live-feed tests are behind the `e2e` build tag and are not run here. The
# upstream throttles new connections severely — measured 0 of 6 attempts
# succeeding with no delay between them — so a CI job that opened one would
# consume a share of a finite, community-wide tolerance on every push. The
# protocol decoder is checked against fixtures captured from the live feed
# instead, which is what actually catches drift.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The version the go directive names, rather than a floating latest:
          # a toolchain change should be a visible diff in this file.
          go-version: '1.26'
          cache: true

      - name: check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...
